name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov scikit-learn scipy numpy

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --cov=core --cov-report=term-missing --cov-report=xml --cov-fail-under=68

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff (pinned via requirements-dev.txt)
        run: pip install -r requirements-dev.txt

      - name: Run ruff check
        run: ruff check core/ tests/

      - name: Run ruff format check
        run: ruff format --check core/ tests/
